[package]
name = "ironhaven-render"
version = "0.1.0"
edition = "2021"
description = "Offline preview renderer for the baked Ironhaven map (part dump -> PNG)."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
rayon = "1"

[profile.release]
opt-level = 3
